version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  google_maps_flutter: ^2.18.1
