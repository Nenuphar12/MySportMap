name: strava_repository
description: A dart Repository which manages the strava API with strava_client.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.9.2
    
dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  google_maps_flutter: ^2.13.1
  json_annotation: ^4.9.0
  latlong2: ^0.9.1
  logger: ^2.6.2
  meta: ^1.16.0
  strava_client: ^2.1.3
  # strava_client:
  #   path: ../strava_flutter

dev_dependencies:
  build_runner: ^2.10.1
  dependency_validator: ^5.0.3
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.0.0
