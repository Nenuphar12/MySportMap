name: my_sport_map
description: A flutter project to view all your strava's activities on one map.
version: 0.3.1+1
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  bloc: ^9.0.1
  envied: ^1.3.1
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  geolocator: ^14.0.0
  google_maps_flutter: ^2.2.5
  logger: ^2.0.0
  strava_repository:
    path: packages/strava_repository

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  dependency_validator: ^5.0.0
  envied_generator: ^1.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  json_annotation: ^4.8.0
  meta: ^1.8.0
  mocktail: ^1.0.0
  strava_client: ^2.1.0
  test: ^1.22.0
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

flutter_icons:
  android: "launcher_icon"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/launcher_icon.png"
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: false
    # image_path: "path/to/image.png"
    # background_color: "#hexcode"
    # theme_color: "#hexcode"
  windows:
    generate: false
    # image_path: "path/to/image.png"
    # icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: false
    # image_path: "path/to/image.png"
